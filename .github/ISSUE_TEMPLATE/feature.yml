name: Feature request
description: Propose a bounded capability or protocol change
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the operational problem, not only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and failure modes
      description: Explain authority changes, crash boundaries, rollback, and migration implications.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
